# 开发 CI：从 Piggy-Cat-bit-shadow/sing-box 构建 libbox.aar，再编译 debug APK 并跑单元测试。
#
# 这个客户端只服务一个内核，所以 CI 只有一个内核构建步骤 —— 没有任何
# mihomo / Xray / hev 的 sidecar 构建、下载或缓存。
name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      # 手动指定要跟随的内核 revision。留空 = 跟随 CORE_BRANCH 的 HEAD。
      #
      # 为什么需要它: 开发 CI 刻意跟随 `testing` HEAD, 所以 upstream 的 `testing` 一旦
      # 自己坏掉, 本仓库的**每一次** push 都会在核心构建那一步失败, 而 app 自己的
      # 单元测试与 APK 组装会被 skip —— 一个与内核无关的改动也因此拿不到 CI 结论。
      # 实测: build_libbox 写出了 libbox.provenance 却没产出 libbox.aar, 随后
      # `cp libbox.aar` 以 "No such file or directory" 失败 (2026-10-09T20:00–20:07,
      # 三个不同 SHA 上完全一致)。
      #
      # 这不是 app 的问题, 但它让 app 的回归信号消失, 那是不可接受的。有了这个输入,
      # 就能在 upstream 修复期间指定一个已知良好的 revision (例如 version.properties
      # 里那个 pin) 继续取得 app 侧的完整 CI 证据。
      #
      # 它**不**改变默认行为, 也**不**改变 pin: release-apk.yml 仍然只从
      # version.properties 的 coreCommit 构建, 并显式比对那个 SHA。
      core_ref:
        description: 'sing-box revision to follow (blank = CORE_BRANCH HEAD)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # 唯一内核：默认分支 testing
  CORE_REPO: Piggy-Cat-bit-shadow/sing-box
  CORE_BRANCH: testing
  # sing-box 的 cmd/internal/build_shared/sdk.go 固定使用这个 NDK，并在
  # checkJavaVersion() 里硬性要求 openjdk 17。
  NDK_VERSION: 28.0.13004108
  GOMOBILE_VERSION: v0.1.12
  # build_libbox 需要 go.mod 的 go 指令版本 (当前 1.25.5)
  GO_VERSION: '1.25.5'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No `packages:` here: the action's default requests the legacy `tools`
      # package, which no longer exists in the SDK repository and makes the
      # step fail. Runners already ship the SDK; we only need it on PATH and
      # the NDK installed below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 单个内核的 cache key 就是它的 commit —— 内核一变就重建。
      # 开发 CI 跟随 testing HEAD(最新代码); Release 走 release-apk.yml 的固定 SHA。
      - name: Resolve core revision
        id: core
        run: |
          set -euo pipefail
          # dispatch 可以指定一个 revision; 留空则跟随分支 HEAD (默认行为, 未变)。
          OVERRIDE="${{ github.event.inputs.core_ref || '' }}"
          if [ -n "$OVERRIDE" ]; then
            if ! printf '%s' "$OVERRIDE" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::core_ref must be a full 40-char lowercase SHA, got '${OVERRIDE}'"
              exit 1
            fi
            SHA="$OVERRIDE"
            echo "core_ref override in effect; this run does NOT track ${CORE_BRANCH} HEAD"
          else
            SHA="$(git ls-remote "https://github.com/${CORE_REPO}.git" "refs/heads/${CORE_BRANCH}" | awk '{print $1}')"
            if [ -z "$SHA" ]; then
              echo "::error::could not resolve ${CORE_REPO}@${CORE_BRANCH}"
              exit 1
            fi
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "CORE_COMMIT=${SHA}" >> "$GITHUB_ENV"
          echo "CORE_COMMIT_FULL=${SHA}" >> "$GITHUB_ENV"
          echo "resolved core = ${SHA}"

      - name: Cache libbox.aar
        id: libbox
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libbox.aar
            app/libs/libbox.provenance
          # The resolved SHA is in the key, so overriding `core_ref` gets its own cache
          # entry instead of colliding with (or silently reusing) the branch-tracking one.
          key: libbox-${{ env.CORE_REPO }}-${{ env.CORE_BRANCH }}-${{ steps.core.outputs.sha }}

      # app/libs 只含 gitignore 的 libbox.aar，checkout 不会创建该目录
      - name: Ensure app/libs exists
        run: mkdir -p app/libs

      # sing-box v1.14 起移除了 `make lib_android`，改用 cmd/internal/build_libbox，
      # 产出 libbox.aar + libbox-legacy.aar(API 21)，本 app minSdk 24 只需前者。
      - name: Build libbox.aar from ${{ env.CORE_REPO }}@${{ env.CORE_BRANCH }}
        if: steps.libbox.outputs.cache-hit != 'true'
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q /tmp/sing-box
          cd /tmp/sing-box
          git remote add origin "https://github.com/${CORE_REPO}.git"
          git fetch --depth 1 origin "${CORE_SHA}"
          git checkout -q FETCH_HEAD
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "${CORE_SHA}" ]; then
            echo "::error::checked out ${ACTUAL} but resolved core revision is ${CORE_SHA}"
            exit 1
          fi
          go install "github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}"
          # Bake the resolved SHA in as BOTH the version string and the recorded
          # revision so the packaged binary is self-describing.
          SING_BOX_BUILD_VERSION="${CORE_SHA}" \
          SING_BOX_BUILD_COMMIT="${CORE_SHA}" \
            go run ./cmd/internal/build_libbox -target android
          cp libbox.aar "${GITHUB_WORKSPACE}/app/libs/libbox.aar"
          cp libbox.provenance "${GITHUB_WORKSPACE}/app/libs/libbox.provenance"
          ls -la "${GITHUB_WORKSPACE}/app/libs/"

      # The gate that catches "this AAR is not from the revision we think" must itself
      # be shown to reject; see the negative cases in that script.
      - name: Provenance gate negative tests
        run: python3 .github/scripts/test_check_core_provenance.py

      # 发布门禁(签名测量 + publish job 的 APK 路径)只有在 v* tag 才会真正运行,
      # 所以它的回归必须在一个**每次 push 都跑**的地方被证明。这一条就是那个地方:
      # 它读 release-apk.yml 与 measure_apk_signature.sh 本身, 检查"下载到哪里"与
      # "去哪里找"是否一致、空列表是否必然失败、以及 unsigned / debug-signed /
      # signed-by-user 的判定表是否 fail-closed。
      - name: Release publish gate checks
        run: python3 .github/scripts/test_release_publish_gate.py

      # What this proves: the AAR matches the revision THIS RUN resolved from
      # CORE_BRANCH=testing. It is deliberately NOT evidence about the revision pinned in
      # version.properties - a green dev run says nothing about the release combination.
      # Only release-apk.yml (which resolves the pin) can attest to that.
      #
      # Cache hits skip the build, so verify the artifact against the resolved
      # revision on every run, not only when it was just compiled.
      - name: Validate core provenance
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: python3 .github/scripts/check_core_provenance.py app/libs/libbox.aar app/libs/libbox.provenance "${CORE_SHA}"

      # 构建元数据注入：关于页显示的 core 来源 / 分支 / commit / 构建时间
      - name: Export core build metadata
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK and verify the packaged core identity
        run: ./gradlew :app:assembleDebug :app:verifyCoreProvenance --no-daemon --console=plain

      - name: Record artifact checksums
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/debug
          sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: satelite-one-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
