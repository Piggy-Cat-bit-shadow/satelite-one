# 推送 v* tag 自动编译 release APK 并发布到 GitHub Release
# 发版: 改 version.properties → 提交 → git tag v<versionName> && git push origin v<versionName>
#
# 流程: 从 Piggy-Cat-bit-shadow/sing-box 构建唯一内核 libbox.aar
#       (app/libs 被 gitignore, CI 从源码重建) → 注入签名(可选 secrets)
#       → assembleRelease(按 ABI 分包) → 校验和 → 上传 Release
#
# 这里没有任何 mihomo / Xray / hev 的下载或编译步骤 —— 本客户端只有一个内核。

name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CORE_REPO: Piggy-Cat-bit-shadow/sing-box
  CORE_BRANCH: testing
  NDK_VERSION: 28.0.13004108
  GOMOBILE_VERSION: v0.1.12
  GO_VERSION: '1.25.5'

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history + tags: the release-notes step diffs against the previous tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Resolve core revision
        id: core
        run: |
          git ls-remote "https://github.com/${CORE_REPO}.git" "refs/heads/${CORE_BRANCH}" \
            | awk '{print "sha="$1}' >> "$GITHUB_OUTPUT"

      - name: Cache libbox.aar
        id: libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.CORE_REPO }}-${{ env.CORE_BRANCH }}-${{ steps.core.outputs.sha }}

      # app/libs 只含 gitignored 的 libbox.aar, checkout 不会创建该目录
      - name: Ensure app/libs exists
        run: mkdir -p app/libs

      - name: Build libbox.aar from ${{ env.CORE_REPO }}@${{ env.CORE_BRANCH }}
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${CORE_BRANCH}" \
            "https://github.com/${CORE_REPO}.git" /tmp/sing-box
          cd /tmp/sing-box
          go install "github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}"
          # shallow clone cannot describe a tag -> let the builder take the version
          SING_BOX_BUILD_VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)" \
            go run ./cmd/internal/build_libbox -target android
          cp libbox.aar "${GITHUB_WORKSPACE}/app/libs/libbox.aar"

      - name: Export core build metadata
        run: |
          set -euo pipefail
          CORE_DIR=/tmp/sing-box
          if [ -d "$CORE_DIR/.git" ]; then
            echo "CORE_COMMIT=$(git -C "$CORE_DIR" rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
            echo "CORE_COMMIT_FULL=$(git -C "$CORE_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "CORE_COMMIT_DATE=$(git -C "$CORE_DIR" log -1 --format=%cI)" >> "$GITHUB_ENV"
            echo "CORE_DESCRIBE=$(git -C "$CORE_DIR" describe --tags --always)" >> "$GITHUB_ENV"
          else
            echo "CORE_COMMIT=${{ steps.core.outputs.sha }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Unit tests run on the debug variant: AGP only creates testDebugUnitTest
      # for this project's configuration.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # 签名材料不入库。配置以下 repo secrets 后, CI 产物与本地正式签名一致:
      #   INTERSTELLAR_KEYSTORE_B64     base64(interstellar.jks)
      #   INTERSTELLAR_STORE_PASSWORD   storePassword
      #   INTERSTELLAR_KEY_ALIAS        keyAlias
      #   INTERSTELLAR_KEY_PASSWORD     keyPassword
      # 未配置时按 app/build.gradle.kts 的回退逻辑使用 debug 签名。
      - name: Restore signing config
        env:
          KEYSTORE_B64: ${{ secrets.INTERSTELLAR_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.INTERSTELLAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTERSTELLAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTERSTELLAR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::签名 secrets 未配置, 本次 APK 使用 debug 签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > interstellar.jks
          {
            echo "storeFile=interstellar.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > signing.properties

      - name: Verify tag matches version.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 version.properties (versionName=${VERSION}) 不一致, 请先改 version.properties 再打对应 tag"
            exit 1
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      # satelite-one-<abi>-release.apk → satelite-one-<abi>-<tag>.apk
      - name: Rename APKs with tag
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_REF_NAME:-$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')}"
          cd app/build/outputs/apk/release
          for f in satelite-one-*-release.apk; do
            mv "$f" "${f%-release.apk}-${SUFFIX}.apk"
          done
          ls -la

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satelite-one-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      # 更新摘要 = "版本提交"(范围内最后改 version.properties 的那个)的完整
      # message(标题+正文), 再附自上一 tag 以来的其余提交。按 version.properties
      # 定位而不是 tag 落点 —— tag 可能落在版本提交之后的杂项提交上(如 v0.5.3)。
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"
          SUMMARY_COMMIT=$(git log --format=%H -1 "$RANGE" -- version.properties 2>/dev/null || true)
          [ -n "$SUMMARY_COMMIT" ] || SUMMARY_COMMIT="$TAG"
          EXCL=$(git rev-parse --short "$SUMMARY_COMMIT")
          {
            echo "## 内核"
            echo
            echo "- ${CORE_REPO} @ ${CORE_BRANCH}"
            echo "- commit: \`${CORE_COMMIT:-unknown}\`"
            echo "- build: ${BUILD_DATE:-unknown}"
            echo
            echo "## 更新摘要"
            echo
            git log -1 --format='%B' "$SUMMARY_COMMIT"
            RANGE_LOG=$(git log --no-merges --format='%h|%s' "$RANGE" 2>/dev/null \
              | grep -v "^${EXCL}|" | sed -e 's/^/- /' -e 's/|/ /' || true)
            if [ -n "$RANGE_LOG" ]; then
              echo
              echo "## 自 ${PREV_TAG:-起始} 以来的全部提交"
              echo
              echo "$RANGE_LOG"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          body_path: release_notes.md
          fail_on_unmatched_files: true
