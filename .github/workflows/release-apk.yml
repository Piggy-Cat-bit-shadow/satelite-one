# 推送 v* tag 自动编译 release APK 并发布到 GitHub Release
# 发版: 改 version.properties → 提交 → git tag v<versionName> && git push origin v<versionName>
#
# 流程: 从 Piggy-Cat-bit-shadow/sing-box 构建唯一内核 libbox.aar
#       (app/libs 被 gitignore, CI 从源码重建) → [仅授权发布路径]注入签名
#       → assembleRelease(按 ABI 分包) → 用 apksigner 实测签名状态 → 校验和
#       → 上传 artifact → [仅授权发布路径]独立的 publish job 建 Release
#
# 这里没有任何 mihomo / Xray / hev 的下载或编译步骤 —— 本客户端只有一个内核。
#
# ---------------------------------------------------------------------------
# 签名行为的真实定义(与 app/build.gradle.kts 一致, 不是推测):
#   (a) release 变体 + 没有 signing.properties → 产物 UNSIGNED(未签名), 装不上。
#       app/build.gradle.kts 只在 signing.properties 里存在 storeFile 时才给
#       release 变体挂 signingConfig; 没有它, release 变体就是一个不签名的包。
#       这里没有"回退到 debug 签名"这回事 —— release 变体从不挂 debug 签名,
#       debug 签名只属于 debug 变体。
#   (b) debug 变体(assembleDebug) → 由 AGP 默认 debug keystore 签名, 且带
#       .debug 后缀的 applicationId; 但只要仓库根存在 signing.properties,
#       debug 变体也会改用正式签名(app/build.gradle.kts 的 debug { } 分支)。
#   (c) 本地正式签名 → 在仓库根放 signing.properties
#       (storeFile/storePassword/keyAlias/keyPassword), 签名材料不入库。
#   本 workflow 因此不在日志或文件名里断言"用了 debug 签名", 而是用 apksigner
#   对产物实测, 并把实测结果( unsigned / debug-signed / signed-by-user )写进文件名、
#   apksigner-verify.txt 和 build-info.json 的 signature_state。
#
# 权限最小化:
#   整个 workflow 默认 contents: read —— 构建 / 验证 / dry-run 全部只读。
#   只有 publish job(只可能在 v* tag push 且 dry_run != true 时运行)单独声明
#   contents: write。写权限不再授予每一次运行。
#
# 签名材料隔离:
#   "Restore signing config" 只在 v* tag push 且 dry_run != true 时可达。
#   workflow_dispatch 默认 dry_run=true, 所以手动触发的运行既不读生产签名
#   secret, 也不会恢复 interstellar.jks / signing.properties。
# ---------------------------------------------------------------------------

name: Release APK

on:
  push:
    tags:
      - 'v*'
  # Dry run(默认): 走完整的 release 路径(固定内核、provenance 门禁、release 构建、
  # 校验和、build-info), 但不签名、不发布。dry_run=false 只在 v* tag push 时才有
  # 意义 —— 分支上的 dispatch 无论如何都不会发布, 见 publish job 的条件。
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate only — no signing material, no release'
        type: boolean
        default: true

# 最小权限: 默认只读。publish job 需要写权限时在那里单独声明。
permissions:
  contents: read

env:
  CORE_REPO: Piggy-Cat-bit-shadow/sing-box
  CORE_BRANCH: testing
  NDK_VERSION: 28.0.13004108
  GOMOBILE_VERSION: v0.1.12
  GO_VERSION: '1.25.5'

jobs:
  build:
    name: Build APK (read-only dry run unless tag push)
    runs-on: ubuntu-latest
    # 显式声明, 不依赖仓库的默认 GITHUB_TOKEN 权限设置。
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.naming.outputs.artifact_name }}
      signature_state: ${{ steps.sig.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 release notes 需要历史与 tag, 那是 publish job 的事; 构建只要一份工作树。
          fetch-depth: 1

      # Make the app side of the evidence chain explicit instead of assumed. Actions
      # checks out github.sha, so this asserts the contract: a misconfigured runner or a
      # stale local tree fails here rather than producing an artifact whose
      # build-info.json claims a revision it was not built from.
      - name: Verify the checked-out app revision
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "${ACTUAL}" != "${GITHUB_SHA}" ]; then
            echo "::error::checked out ${ACTUAL} but this run is for ${GITHUB_SHA}"
            exit 1
          fi
          echo "APP_COMMIT_FULL=${ACTUAL}" >> "$GITHUB_ENV"
          echo "building app revision ${ACTUAL}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No `packages:` here: the action's default requests the legacy `tools`
      # package, which no longer exists in the SDK repository and makes the
      # step fail. Runners already ship the SDK; we only need it on PATH and
      # the NDK installed below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Release pins the core: the SHA comes from version.properties, never from
      # testing HEAD. Re-running the same release tag therefore always rebuilds
      # from the identical core revision.
      - name: Resolve pinned core revision
        id: core
        run: |
          set -euo pipefail
          SHA="$(grep '^coreCommit=' version.properties | cut -d= -f2 | tr -d ' \r')"
          if [ -z "$SHA" ]; then
            echo "::error::version.properties has no coreCommit= entry; a release must pin its core revision"
            exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::coreCommit must be a full 40-char lowercase commit SHA, got '${SHA}'"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved pinned coreCommit=${SHA}"
          echo "CORE_COMMIT=${SHA}" >> "$GITHUB_ENV"
          echo "CORE_COMMIT_FULL=${SHA}" >> "$GITHUB_ENV"

      # Verify the pin is real BEFORE the cache can short-circuit anything.
      # `git ls-remote` lists ref TIPS only, so it can never confirm an ancestor
      # commit; fetching the SHA is the actual existence check. This runs
      # unconditionally, so a cache hit is covered too.
      - name: Verify pinned core revision is fetchable
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pin-check
          git init -q /tmp/pin-check
          cd /tmp/pin-check
          git remote add origin "https://github.com/${CORE_REPO}.git"
          if ! git fetch --depth 1 origin "${CORE_SHA}" 2>/dev/null; then
            echo "::error::pinned core commit ${CORE_SHA} is not fetchable from ${CORE_REPO}"
            exit 1
          fi
          FETCHED="$(git rev-parse FETCH_HEAD)"
          if [ "$FETCHED" != "${CORE_SHA}" ]; then
            echo "::error::fetched ${FETCHED} but pinned coreCommit is ${CORE_SHA}"
            exit 1
          fi
          echo "pinned core commit ${CORE_SHA} is fetchable from ${CORE_REPO}"

      - name: Cache libbox.aar
        id: libbox
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libbox.aar
            app/libs/libbox.provenance
          key: libbox-${{ env.CORE_REPO }}-${{ steps.core.outputs.sha }}

      # app/libs 只含 gitignored 的 libbox.aar, checkout 不会创建该目录
      - name: Ensure app/libs exists
        run: mkdir -p app/libs

      - name: Build libbox.aar from pinned ${CORE_REPO}@${{ steps.core.outputs.sha }}
        if: steps.libbox.outputs.cache-hit != 'true'
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q /tmp/sing-box
          cd /tmp/sing-box
          git remote add origin "https://github.com/${CORE_REPO}.git"
          git fetch --depth 1 origin "${CORE_SHA}"
          git checkout -q FETCH_HEAD
          # prove we are on the pinned revision before building
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "${CORE_SHA}" ]; then
            echo "::error::checked out ${ACTUAL} but pinned coreCommit is ${CORE_SHA}"
            exit 1
          fi
          go install "github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}"
          # Bake the pinned SHA in as BOTH the version string and the recorded
          # revision, so the packaged binary is self-describing and verifiable.
          SING_BOX_BUILD_VERSION="${CORE_SHA}" \
          SING_BOX_BUILD_COMMIT="${CORE_SHA}" \
            go run ./cmd/internal/build_libbox -target android
          cp libbox.aar "${GITHUB_WORKSPACE}/app/libs/libbox.aar"
          cp libbox.provenance "${GITHUB_WORKSPACE}/app/libs/libbox.provenance"

      # A gate nobody has seen fail is not evidence. This exercises the rejection cases
      # (AAR built from another revision = a cache collision, relabelled provenance,
      # missing files, empty expected SHA, AAR without libbox.so) so a regression in the
      # gate itself cannot silently pass a release.
      - name: Provenance gate negative tests
        run: python3 .github/scripts/test_check_core_provenance.py

      # 同一个理由, 针对签名与发布门禁: publish job 只在 v* tag 才跑, 所以
      #   * APK 从哪来(download-artifact 落到工作目录)与校验步骤去哪找是否一致,
      #   * 空列表是否必然失败,
      #   * unsigned / debug-signed / signed-by-user 的判定表是否 fail-closed,
      # 这三件事必须在这里被证明 —— 否则它们只会在真要发版的那一次才第一次执行。
      - name: Release publish gate checks
        run: python3 .github/scripts/test_release_publish_gate.py

      # The core's own provenance record is the single source of truth; it also
      # has to survive a cache hit, where no checkout exists.
      - name: Validate core provenance
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: python3 .github/scripts/check_core_provenance.py app/libs/libbox.aar app/libs/libbox.provenance "${CORE_SHA}"

      - name: Export core build metadata
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "APP_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          # CORE_COMMIT / CORE_COMMIT_FULL were exported when the SHA was pinned
          echo "coreCommit=${CORE_SHA}"

      # Unit tests run on the debug variant: AGP only creates testDebugUnitTest
      # for this project's configuration.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # ---------------------------------------------------------------------
      # 签名材料: 只在这一个条件成立时可达 —— v* tag push 且 dry_run != true。
      # workflow_dispatch(默认 dry_run=true)与分支 push 都到不了这里: secrets 不会
      # 被解析进环境, interstellar.jks / signing.properties 不会出现。
      # 注意: 有没有签名材料不改变 release 怎么构建, 只决定它签不签名 ——
      # 没有 signing.properties 的 release 变体是 UNSIGNED, 不是 debug 签名。
      # ---------------------------------------------------------------------
      - name: Restore signing config
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          KEYSTORE_B64: ${{ secrets.INTERSTELLAR_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.INTERSTELLAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTERSTELLAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTERSTELLAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            # main used to warn here and carry on, exporting SIGNATURE_STATE=debug-signed.
            # That was wrong twice over: an assembleRelease with no signing.properties is
            # UNSIGNED (app/build.gradle.kts only attaches a signingConfig when
            # signing.properties carries storeFile), and it let an unsigned APK walk toward
            # a release. Fail instead, and let the apksigner measurement below be the only
            # thing that ever names the signature state.
            echo "::error::v* tag push 要求正式签名, 但 INTERSTELLAR_KEYSTORE_B64 未配置。"
            echo "::error::不签名就发布 release 会被下面的 apksigner 检查拦下 —— 这里提前失败, 不产生未签名的'正式包'。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > interstellar.jks
          {
            echo "storeFile=interstellar.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > signing.properties
          # No SIGNATURE_STATE export: the state is measured from the built APKs by
          # apksigner, never asserted by the step that installed the keystore.
          echo "signing material restored for a tag-push release build"

      # 反向断言: 非授权路径上不允许存在任何签名材料。它与上面的 if 互为补集,
      # 所以"dry run 读不到生产签名材料"在 CI 日志里是可见的事实而不是承诺。
      - name: Assert no signing material on the read-only path
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true) }}
        run: |
          set -euo pipefail
          for f in interstellar.jks signing.properties keystore.properties; do
            if [ -e "$f" ]; then
              echo "::error::$f exists on a non-release path — signing material must never reach a dry run"
              exit 1
            fi
          done
          echo "no signing material present (interstellar.jks / signing.properties / keystore.properties all absent)"

      - name: Verify tag matches version.properties
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 version.properties (versionName=${VERSION}) 不一致, 请先改 version.properties 再打对应 tag"
            exit 1
          fi

      # What each gate actually proves - they are NOT redundant and NOT interchangeable:
      #
      #  * check_core_provenance.py (above) is the PIN check: it compares the AAR and its
      #    provenance against the revision this run resolved from version.properties.
      #    That is the only non-circular check that the shipped core is the pinned one.
      #  * :app:verifyCoreProvenance is the SELF-CONSISTENCY check: its expectation comes
      #    from app/libs/libbox.provenance itself (that file wins over CORE_COMMIT_FULL and
      #    over any local checkout), so it catches "the packaged libbox.so does not carry
      #    the identity its own provenance records" - a relabelled or stale AAR. It cannot
      #    by itself detect a wrong pin, which is exactly why the Python gate must run too.
      # Running both covers "the file on disk is the pinned one" AND "the APK contains it".
      - name: Build release APK and verify the packaged core identity
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:verifyCoreProvenance --no-daemon --console=plain

      # 签名状态是"测"出来的, 不是从注释推断的。apksigner 的原始输出随 artifact
      # 一起上传(apksigner-verify.txt), 并写进 build-info.json。
      #
      # 测量本身搬进了 .github/scripts/measure_apk_signature.sh, 原因不是好看:
      #   * 它由 test_release_publish_gate.py 逐条读回来验证 —— 判定表(case 分支的
      #     顺序与 fail-closed)和"空列表必然失败"都是被断言的对象, 而不是注释里的承诺;
      #   * publish job 现在调用同一个脚本, 所以"构建时怎么判"与"发布前怎么判"
      #     不可能再各自漂移 —— 之前那两份拷贝里的路径就是不一致的。
      - name: Measure APK signature state with apksigner
        id: sig
        env:
          # dry run 必须实测 unsigned; v* tag 正式路径必须实测 signed-by-user。
          EXPECT_SIGNATURE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true) && 'signed' || 'unsigned' }}
        run: |
          set -euo pipefail
          bash .github/scripts/measure_apk_signature.sh \
            "$EXPECT_SIGNATURE" app/build/outputs/apk/release \
            | tee app/build/outputs/apk/release/apksigner-verify.txt

      # 文件名必须自己说清楚这是什么, 不能让未签名的 dry-run 产物看起来像可以直接
      # 安装的正式包:
      #   dry run  → satelite-one-<version>-<abi>-unsigned-dryrun.apk
      #   正式发布 → satelite-one-<version>-<abi>-signed-<tag>.apk
      - name: Rename APKs to unambiguous names
        id: naming
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
          SIG_STATE: ${{ steps.sig.outputs.state }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')"
          if [ "${RELEASE_BUILD:-false}" = "true" ]; then
            KIND="${GITHUB_REF_NAME}"
          else
            KIND="dryrun"
          fi
          if [ "$SIG_STATE" = "signed-by-user" ]; then
            KIND="signed-${KIND}"
          else
            KIND="${SIG_STATE}-${KIND}"
          fi
          cd app/build/outputs/apk/release
          shopt -s nullglob
          for f in satelite-one-*-release.apk; do
            ABI="${f#satelite-one-}"
            ABI="${ABI%-release.apk}"
            mv "$f" "satelite-one-${VERSION}-${ABI}-${KIND}.apk"
          done
          shopt -u nullglob
          ls -la
          # KIND already carries the measured signature state (signed-… / unsigned-…),
          # so it must not be repeated here.
          ARTIFACT_NAME="satelite-one-${VERSION}-${KIND}-run${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact: ${ARTIFACT_NAME}"

      # 把"要被验证的东西"和"要被上传的东西"变成同一个**扁平**目录。
      #
      # 第五轮修的是 publish job 去错路径找 APK 导致验签空转; 但它留下的缺口是:
      # 验签用 `find .`, 而 action-gh-release 的 files: 仍写另一个构建目录布局 ——
      # 被验证的字节与被上传的字节由两个不同的路径表达式描述, 没有任何东西保证它们
      # 一致。这里把产物规整成一个扁平的 release-bundle/, 于是两者只能是同一批文件。
      #
      # 扁平是刻意的: 嵌套目录正是旧 bug 藏身之处(同一个字节有两个都说得通的路径),
      # verify_release_bundle.py 会把任何子目录直接判为失败。
      - name: Assemble the flat release bundle
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
          SIG_STATE: ${{ steps.sig.outputs.state }}
          VERSION: ${{ steps.naming.outputs.version }}
          KIND: ${{ steps.naming.outputs.kind }}
          EXPECT_SIGNATURE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true) && 'signed' || 'unsigned' }}
        run: |
          set -euo pipefail

          # ---- 1. collect the final APKs into a FLAT bundle -------------------------
          rm -rf release-bundle
          mkdir -p release-bundle
          APK_DIR="${GITHUB_WORKSPACE}/app/build/outputs/apk/release"
          shopt -s nullglob
          BUNDLED=0
          for f in "$APK_DIR"/*.apk; do
            cp "$f" "${GITHUB_WORKSPACE}/release-bundle/"
            BUNDLED=$((BUNDLED + 1))
          done
          shopt -u nullglob
          if [ "$BUNDLED" -eq 0 ]; then
            echo "::error::no release APKs to bundle"
            exit 1
          fi
          cp "$APK_DIR/apksigner-verify.txt" "${GITHUB_WORKSPACE}/release-bundle/"
          cd "${GITHUB_WORKSPACE}/release-bundle"
          echo "=== release-bundle ($BUNDLED APK) ==="
          ls -la

          # ---- 2. the manifest describes THESE files --------------------------------
          #
          # Written here, from the renamed files, rather than in an earlier step:
          #   * an earlier step produced it BEFORE the rename, so its entries named
          #     satelite-one-<abi>-release.apk - files that no longer exist;
          #   * and it used `sha256sum ./*.apk`, whose `./` prefix `sha256sum --check`
          #     matches literally, so it could not even verify its own output.
          # One step owning "copy, hash, describe, prove" is what makes that impossible.
          sha256sum ./*.apk > SHA256SUMS.txt
          sed -i 's|  \./|  |' SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Prove it now: a manifest that does not match the bundle must fail HERE, not in
          # the release job.
          sha256sum --check SHA256SUMS.txt

          # ---- 3. build-info.json, derived from the same files ----------------------
          VERSION_CODE="$(grep '^versionCode=' "${GITHUB_WORKSPACE}/version.properties" | cut -d= -f2 | tr -d ' \r')"
          sha_for() { grep -F -m1 -- "-$1-" SHA256SUMS.txt | awk '{print $1}'; }
          APK_ARM64_SHA="$(sha_for arm64-v8a)"
          APK_X86_64_SHA="$(sha_for x86_64)"
          AAR_SHA="$(sha256sum "${GITHUB_WORKSPACE}/app/libs/libbox.aar" | awk '{print $1}')"
          AAR_SIZE="$(wc -c < "${GITHUB_WORKSPACE}/app/libs/libbox.aar" | tr -d ' ')"
          for pair in "arm64-v8a:${APK_ARM64_SHA}" "x86_64:${APK_X86_64_SHA}"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::no SHA256 for ${pair%%:*} in SHA256SUMS.txt; build-info.json would be incomplete"
              cat SHA256SUMS.txt
              exit 1
            fi
          done
          cat > build-info.json <<JSON
          {
            "app_repository": "${GITHUB_REPOSITORY}",
            "app_version": "${VERSION}",
            "app_version_code": ${VERSION_CODE},
            "app_commit": "${GITHUB_SHA}",
            "app_commit_full": "${APP_COMMIT_FULL:-${GITHUB_SHA}}",
            "app_ref": "${GITHUB_REF_NAME}",
            "core_repository": "${CORE_REPO}",
            "core_commit": "${CORE_SHA}",
            "core_ref": "pinned",
            "core_branch_hint": "${CORE_BRANCH}",
            "core_version_string": "${CORE_SHA}",
            "core_aar_sha256": "${AAR_SHA}",
            "core_aar_size": ${AAR_SIZE},
            "signature_state": "${SIG_STATE}",
            "signature_state_measured_by": "apksigner verify --verbose --print-certs",
            "apk_arm64_v8a_sha256": "${APK_ARM64_SHA}",
            "apk_x86_64_sha256": "${APK_X86_64_SHA}",
            "build_time": "${BUILD_DATE}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          JSON
          python3 -c "import json,sys; json.load(open('build-info.json')); print('build-info.json is valid JSON')"
          cat build-info.json

          # ---- 4. run the SAME verifier the publish job will run --------------------
          python3 "${GITHUB_WORKSPACE}/.github/scripts/verify_release_bundle.py" . \
            --expect-signature "$EXPECT_SIGNATURE" \
            --expect-version "$VERSION" \
            --expect-kind "$KIND" \
            --expect-app-commit "${APP_COMMIT_FULL:-$GITHUB_SHA}" \
            --expect-core-commit "$CORE_SHA" \
            --list-to bundle-files.txt
          echo "=== bundle verifier agreed; publishable files ==="
          cat bundle-files.txt

      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          # 名字里带版本与实测签名状态: artifact 列表本身就能区分
          # "未签名的 dry run" 和 "签过名的正式包"。
          name: ${{ steps.naming.outputs.artifact_name }}
          # 单一扁平目录: artifact 里就是这些文件本身, 没有多余的目录层级可以让
          # 下载端和上传端对"文件在哪"产生分歧。
          path: release-bundle/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布是独立 job, 也是唯一持有写权限的地方。两道门:
  #   1) job-level if: 只可能在 v* tag push 且 dry_run != true 时运行;
  #   2) 发布前用 apksigner 复测签名, 未签名或 debug keystore 签名就拒绝发布。
  # 分支 push 与 workflow_dispatch 永远到不了这里 —— 分支 push 不会自动发布。
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub release (tag push, explicitly authorized)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history + tags: the release-notes step diffs against the previous tag
          fetch-depth: 0

      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-bundle

      # 发布前的最后一道工具化检查: 这一步失败就没有 Release。
      #
      # 这里曾经找错路径: download-artifact 把 artifact 的内容摊在一个目录里, 而这一步
      # 去 app/build/outputs/apk/release/ 找 —— 那是 build job 里真实存在的目录, 而
      # publish job 只做 checkout, 并不重建 APK。配合 `nullglob`, 通配符展开为空数组,
      # 循环体一次都不执行, 于是脚本会打印 "all 0 APKs verify as signed" 并成功退出,
      # 把一个**从未被验证过**的 artifact 直接送进 Release。
      #
      # 现在由 verify_release_bundle.py 一次做完: 要求 bundle 是扁平的、恰好两个 ABI、
      # 每个文件都对得上 SHA256SUMS.txt、build-info.json 描述的就是这批字节、core 是
      # 40 位固定 pin、签名状态符合本次运行的要求。它把**可发布文件清单**写到
      # BUNDLE_FILES, 下一步上传的就是这个清单 —— 被验证的字节和被上传的字节因此是
      # 同一批文件, 而不是两个"应该一致"的路径表达式。
      - name: Verify the release bundle before publishing
        id: preflight
        run: |
          set -euo pipefail
          ls -la release-bundle
          VERSION="$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')"
          python3 .github/scripts/verify_release_bundle.py release-bundle \
            --expect-signature signed \
            --expect-version "$VERSION" \
            --list-to bundle-files.txt
          if [ ! -s bundle-files.txt ]; then
            echo "::error::the preflight produced no publishable file list"
            exit 1
          fi
          echo "=== files that will be uploaded (the verified set) ==="
          cat bundle-files.txt
          # 与 build job 同一个测量脚本, 对**同一批实际文件**再测一次签名。
          mapfile -t APKS < <(grep '\.apk$' bundle-files.txt)
          if [ "${#APKS[@]}" -ne 2 ]; then
            echo "::error::expected exactly 2 per-ABI APKs in the verified set, got ${#APKS[@]}"
            exit 1
          fi
          bash .github/scripts/measure_apk_signature.sh signed "${APKS[@]}"
          echo "all ${#APKS[@]} APKs verify as signed with a non-debug certificate"

      # 更新摘要 = "版本提交"(范围内最后改 version.properties 的那个)的完整
      # message(标题+正文), 再附自上一 tag 以来的其余提交。按 version.properties
      # 定位而不是 tag 落点 —— tag 可能落在版本提交之后的杂项提交上(如 v0.5.3)。
      # 内核/构建元数据取自 artifact 里的 build-info.json —— 现在是 release-bundle/
      # 里那一份, 也就是 preflight 刚刚校验过的那一份, 而不是可能存在的另一份拷贝。
      - name: Generate release notes
        run: |
          set -euo pipefail
          python3 - <<'PY' > core_meta.txt
          import json
          d = json.load(open("release-bundle/build-info.json"))
          for key in ("core_repository", "core_branch_hint", "core_commit", "build_time", "signature_state"):
              print(d[key])
          PY
          META=()
          while IFS= read -r line; do META+=("$line"); done < core_meta.txt
          CORE_REPO_OUT="${META[0]}"
          CORE_BRANCH_OUT="${META[1]}"
          CORE_COMMIT_OUT="${META[2]}"
          BUILD_DATE_OUT="${META[3]}"
          SIGNATURE_STATE_OUT="${META[4]}"
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"
          SUMMARY_COMMIT=$(git log --format=%H -1 "$RANGE" -- version.properties 2>/dev/null || true)
          [ -n "$SUMMARY_COMMIT" ] || SUMMARY_COMMIT="$TAG"
          EXCL=$(git rev-parse --short "$SUMMARY_COMMIT")
          {
            echo "## 内核"
            echo
            echo "- ${CORE_REPO_OUT} @ ${CORE_BRANCH_OUT}"
            echo "- commit: \`${CORE_COMMIT_OUT}\`"
            echo "- build: ${BUILD_DATE_OUT}"
            echo "- APK 签名: \`${SIGNATURE_STATE_OUT}\`(apksigner 实测, 见 apksigner-verify.txt)"
            echo "- app commit: \`${APP_COMMIT_FULL:-unknown}\`"
            echo
            echo "## 更新摘要"
            echo
            git log -1 --format='%B' "$SUMMARY_COMMIT"
            RANGE_LOG=$(git log --no-merges --format='%h|%s' "$RANGE" 2>/dev/null \
              | grep -v "^${EXCL}|" | sed -e 's/^/- /' -e 's/|/ /' || true)
            if [ -n "$RANGE_LOG" ]; then
              echo
              echo "## 自 ${PREV_TAG:-起始} 以来的全部提交"
              echo
              echo "$RANGE_LOG"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # 只上传 preflight 实际验证过的那些路径(bundle-files.txt)。
          #
          # 这里曾经写 `app/build/outputs/apk/release/*.apk` 等四个构建目录路径, 与验签
          # 步骤的落点无关 —— 也就是说"被验证的文件"和"被发布的文件"由两个独立的路径
          # 表达式描述, 只有约定保证它们指同一批字节。现在两者是同一个清单:
          # verify_release_bundle.py 输出什么, 这里就上传什么。
          #
          # 用清单而不是 release-bundle/* 通配, 是为了让"多余文件混进 Release"不可能
          # 发生: bundle 里若出现第三个 APK, preflight 已经因为 ABI 数量不符而失败。
          files: |
            release-bundle/*.apk
            release-bundle/SHA256SUMS.txt
            release-bundle/apksigner-verify.txt
            release-bundle/build-info.json
          body_path: release_notes.md
          fail_on_unmatched_files: true
