# 全局唯一的版本定义处 — 所有版本相关的地方都读这里:
#   app/build.gradle.kts (versionCode / versionName / BuildConfig)
#   设置页"版本"行 (BuildConfig.VERSION_NAME)
#   CI (校验 tag = v<versionName>)
# 发版步骤: 改这里 → 提交 → git tag v<versionName> → git push origin v<versionName>
#
# versionName 不再只属于本仓库: 它与厂商仓库 Piggy-Cat-bit-shadow/sing-box 的
# 发版权威 release/JIEJIE_VERSION 对齐, 内核发到哪个版本, App 就标哪个版本, 客户端
# 与内核因此是同一个版本号。versionCode 仍然只表示"第几次构建" —— 它保持单调递增
# (上一发布 42, 每次发布 +1), 不跟随 versionName 的数值。
versionCode=49
versionName=0.1.33

# Release 内核固定点 — Piggy-Cat-bit-shadow/sing-box 的完整 commit SHA。
#
# Release 必须固定内核 revision: 同一个 App release tag 如果每次重新运行都去解析
# testing HEAD, 同一个 tag 就会对应到不同的内核, 产物不可复现。
# 开发用 CI(.github/workflows/android-ci.yml) 仍然跟随 testing HEAD。
#
# 发版前把这个值更新为要发布的内核 commit, 并与 app 一起提交。
#
# 与上面 versionName 一致的固定点: 厂商仓库 v0.1.33 tag 及其 Release 都指向这一个
# commit(annotated tag -> a0bbf666dec8693450c0e8363ed42db3294ac64a), 该 tag 已随 Release 冻结。
coreCommit=a0bbf666dec8693450c0e8363ed42db3294ac64a
